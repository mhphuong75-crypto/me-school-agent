name: "Cap nhat du lieu Agent Sotana"

on:
  # Chi chay thu cong - team bam Run workflow sau khi upload file len SharePoint
  workflow_dispatch:

jobs:
  rebuild-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install sentence-transformers numpy python-docx pdfplumber openpyxl python-pptx python-dotenv msal requests

      - name: Chay ingest.py (lay du lieu tu SharePoint)
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_SITE_URL: ${{ secrets.SHAREPOINT_SITE_URL }}
        run: |
          python ingest.py --reset

      - name: Kiem tra ket qua
        run: |
          echo "=== Ket qua ==="
          ls -lh vectors.npy metadata.json
          echo ""
          echo "So luong chunks:"
          python -c "import json; data=json.load(open('metadata.json')); print(f'  {len(data)} chunks tu {len(set(d[\"file_name\"] for d in data))} files')"

      - name: Commit va push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vectors.npy metadata.json

          # Chi commit neu co thay doi
          if git diff --cached --quiet; then
            echo "Khong co thay doi nao trong du lieu."
          else
            git commit -m "Auto-update data from SharePoint $(date +'%Y-%m-%d %H:%M')"
            git push
            echo "Da push thanh cong! App se tu deploy trong 1-2 phut."
          fi
